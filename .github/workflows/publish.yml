name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Test relay isolation
        run: npm test
      - name: Test sandbox net
        run: npm test --prefix packages/sandbox-net
      - name: Publish relay isolation
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; skipping"
          else
            npm publish --registry=https://registry.npmjs.org/ --loglevel=verbose --fetch-retries=0
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sandbox net
        working-directory: packages/sandbox-net
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; skipping"
          else
            npm publish --registry=https://registry.npmjs.org/ --loglevel=verbose --fetch-retries=0
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
