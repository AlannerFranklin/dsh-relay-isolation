name: AlannerFranklin/dsh-relay-isolation
category: tools
description:
  en: 'Provisions an isolated DSH_HOME for any OpenAI-compatible relay: probes the protocol, discovers models, writes a launcher, and installs a host-side network tool so the sandbox keeps its write boundary.'
  zh: '为任意 OpenAI 兼容中转站生成独立 DSH_HOME：自动探测协议、发现模型、生成启动器，并装上宿主代发的网络工具，沙箱的写入边界不变。'
